[project]
name = "autonetworker"
version = "0.1.0"
description = "Draft personalized networking emails from a campaign file (OpenClaw skill backend)"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
autonet = "autonet.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autonet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
