# Global settings. Paths are relative to this file's folder.
paths:
  db: data/autonet.db
  dry_run_db: data/dryrun.db      # --dry-run never touches the real database
  out: out
  logs: logs
  templates: templates
  signatures: signatures.yaml

jev:
  provider: typesafe              # typesafe | openrouter | cloudflare | off (= rules fallback only)
  model: jev-latest               # openrouter: typesafe/jev-1.14 · cloudflare: typesafe/jev
  # pin_version: jev-1.13.0       # once picks look right, so a jev-latest update can't change them silently
  min_confidence: 0.6
  timeout: 10

# Provider pool (section 4). Every provider you have a free account with, treated as one pool.
# A provider without its key in the environment is skipped and named in the run report.
providers:
  pace: even                      # even = spread each allowance over the days left; burst = spend as needed
  reserve: 5                      # credits per provider held back for manual lookups
  sources:                        # Stage 1: tried in order until the run has enough new people
    - { name: pdl,     monthly: 100 }               # 1 credit per record returned
    - { name: apollo,  monthly: 75 }                # search is free; 1 credit to enrich each person
  finders:                        # Stage 3: tried in order for each person until one passes
    - { name: hunter,  monthly: 50 }                # 1 per address found, 0.5 per verification, misses free
    - { name: prospeo, monthly: 75 }
    - { name: apollo,  monthly: 75 }                # same allowance as the apollo source above

limits:
  daily_draft_cap: 25             # across all campaigns

# Text model for Stage 4 extraction and the optional polish. Credentials: ANTHROPIC_API_KEY,
# ANTHROPIC_AUTH_TOKEN, or an `ant auth login` profile.
llm:
  model: claude-opus-5-5
  fallbacks: default              # server-side refusal fallback; off to disable

draft:
  polish: false                   # true = one model call per draft to smooth grammar (guarded: no new facts, ≤25% changed)
  include_opt_out_line: true
  opt_out_line: "If you'd rather I not follow up, just let me know."

budgets:                          # monthly ceilings, checked against the ledger
  hunter_monthly: 50
  provider_monthly: {}
  search_monthly: 1000            # web searches across all campaigns (Brave's free tier is limited; check yours)

retention_days: 365

dry_run:
  prospects: fixtures/dryrun/prospects.jsonl
  emails: fixtures/dryrun/emails.yaml

# Mailbox drafts (delivery: graph_draft | gmail_draft). Tokens are cached outside the repo, mode 600.
mailbox:
  microsoft:
    client_id: ""                 # your Entra app registration (public client, Mail.ReadWrite only, no Mail.Send)
    tenant: organizations         # or your school's tenant id
    # token_cache: ~/.config/autonetworker/microsoft_token.json
  google:
    # client_secrets: ~/.config/autonetworker/google_client_secret.json   # "Desktop app" OAuth client JSON
    # token_cache: ~/.config/autonetworker/google_token.json
